<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowstate Recorder</title>
  <style>
    :root {
      --bg: #f2f6f7;
      --paper: #ffffff;
      --ink: #1c2428;
      --muted: #566066;
      --line: #d5dde1;
      --accent: #0f766e;
      --accent2: #efb700;
      --accent3: #2952a3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #e8fbf6 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, #e8efff 0%, transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 25, 35, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 2.2vw + 0.8rem, 2rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #startBtn { background: var(--accent); color: #fff; }
    #stopBtn { background: var(--accent2); color: #1f1a08; }
    #uploadBtn { background: var(--accent3); color: #fff; }

    .panel {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fafcfd;
    }

    #status {
      font-size: 0.95rem;
      color: #253038;
    }

    pre {
      margin: 10px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      overflow: auto;
      font-size: 0.82rem;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Flowstate Mic Recorder</h1>
    <p>Records using getUserMedia, encodes WAV in-browser, uploads to POST /capture, and shows latest rows from GET /nodes.</p>

    <section class="row">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="uploadBtn" disabled>Upload WAV</button>
    </section>

    <section class="panel">
      <div id="status">Ready</div>
      <audio id="preview" controls></audio>
      <pre id="result">Upload response will appear here</pre>
      <pre id="nodes">Nodes list will appear here</pre>
    </section>
  </main>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const nodesEl = document.getElementById("nodes");
    const previewEl = document.getElementById("preview");

    let audioContext;
    let mediaStream;
    let sourceNode;
    let processorNode;
    let chunks = [];
    let wavBlob = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function floatTo16BitPCM(float32Array) {
      const output = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i += 1) {
        const sample = Math.max(-1, Math.min(1, float32Array[i]));
        output[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return output;
    }

    function writeString(view, offset, text) {
      for (let i = 0; i < text.length; i += 1) {
        view.setUint8(offset + i, text.charCodeAt(i));
      }
    }

    function mergeChunks(list) {
      const size = list.reduce((sum, arr) => sum + arr.length, 0);
      const merged = new Float32Array(size);
      let offset = 0;
      for (const arr of list) {
        merged.set(arr, offset);
        offset += arr.length;
      }
      return merged;
    }

    function encodeWav(samples, sampleRate) {
      const pcm = floatTo16BitPCM(samples);
      const bytesPerSample = 2;
      const buffer = new ArrayBuffer(44 + pcm.length * bytesPerSample);
      const view = new DataView(buffer);

      writeString(view, 0, "RIFF");
      view.setUint32(4, 36 + pcm.length * bytesPerSample, true);
      writeString(view, 8, "WAVE");
      writeString(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, "data");
      view.setUint32(40, pcm.length * bytesPerSample, true);

      let offset = 44;
      for (let i = 0; i < pcm.length; i += 1) {
        view.setInt16(offset, pcm[i], true);
        offset += 2;
      }

      return new Blob([view], { type: "audio/wav" });
    }

    async function refreshNodes() {
      try {
        const response = await fetch("/nodes");
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Failed to fetch nodes");
        }
        nodesEl.textContent = JSON.stringify(payload.slice(-8), null, 2);
      } catch (err) {
        nodesEl.textContent = `Nodes fetch failed: ${String(err)}`;
      }
    }

    async function startRecording() {
      try {
        chunks = [];
        wavBlob = null;
        setStatus("Requesting microphone permission...");

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            noiseSuppression: true,
            echoCancellation: true,
          },
        });

        audioContext = new AudioContext({ sampleRate: 44100 });
        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        processorNode = audioContext.createScriptProcessor(4096, 1, 1);

        processorNode.onaudioprocess = (event) => {
          const data = event.inputBuffer.getChannelData(0);
          chunks.push(new Float32Array(data));
        };

        sourceNode.connect(processorNode);
        processorNode.connect(audioContext.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        uploadBtn.disabled = true;
        setStatus("Recording...");
      } catch (err) {
        setStatus("Failed to start recording");
        resultEl.textContent = String(err);
      }
    }

    async function stopRecording() {
      if (!audioContext) return;

      processorNode.disconnect();
      sourceNode.disconnect();
      mediaStream.getTracks().forEach((track) => track.stop());
      await audioContext.close();

      const merged = mergeChunks(chunks);
      wavBlob = encodeWav(merged, 44100);

      previewEl.src = URL.createObjectURL(wavBlob);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      uploadBtn.disabled = false;
      setStatus(`Recorded ${Math.round(wavBlob.size / 1024)} KB WAV`);
    }

    async function uploadWav() {
      if (!wavBlob) return;

      setStatus("Uploading to /capture...");
      uploadBtn.disabled = true;

      const form = new FormData();
      form.append("file", wavBlob, `capture_${Date.now()}.wav`);

      try {
        const response = await fetch("/capture", {
          method: "POST",
          body: form,
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Upload failed");
        }

        resultEl.textContent = JSON.stringify(payload, null, 2);
        setStatus("Upload complete and DB row inserted");
        await refreshNodes();
      } catch (err) {
        resultEl.textContent = String(err);
        setStatus("Upload failed");
      } finally {
        uploadBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);
    uploadBtn.addEventListener("click", uploadWav);

    refreshNodes();
  </script>
</body>
</html>
