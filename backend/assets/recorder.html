<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAV Recorder</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #fffdfa;
      --text: #22211f;
      --muted: #69645d;
      --accent: #0e7c6b;
      --accent-2: #ffc857;
      --line: #ddd4c6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #fff8e8 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #e8fff7 0%, transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 12px 40px rgba(10, 25, 20, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 2vw + 1rem, 2rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    #startBtn { background: var(--accent); color: #fff; }
    #stopBtn { background: var(--accent-2); color: #2d230f; }
    #uploadBtn { background: #2b4f8f; color: #fff; }

    .panel {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #fffcf7;
    }

    #status { font-size: 0.95rem; color: #3a342f; }

    pre {
      margin: 10px 0 0;
      padding: 12px;
      border-radius: 10px;
      background: #1f2937;
      color: #eef2ff;
      overflow: auto;
      font-size: 0.84rem;
    }

    audio { margin-top: 12px; width: 100%; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mic to WAV Upload</h1>
    <p>Captures audio from <code>getUserMedia</code>, encodes it to WAV, and uploads to <code>/api/audio/upload</code>.</p>

    <section class="row">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="uploadBtn" disabled>Upload WAV</button>
    </section>

    <section class="panel">
      <div id="status">Ready</div>
      <audio id="preview" controls></audio>
      <pre id="result">No upload yet</pre>
      <pre id="dbRows">DB rows will appear here</pre>
    </section>
  </main>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const dbRowsEl = document.getElementById("dbRows");
    const previewEl = document.getElementById("preview");

    let audioContext;
    let mediaStream;
    let sourceNode;
    let processorNode;
    let chunks = [];
    let wavBlob = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function loadRecentDbRows() {
      try {
        const response = await fetch("/api/nodes/recent?limit=8");
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Failed to load DB rows");
        }

        const rows = payload.nodes.map((n) => ({
          id: n.id,
          label: n.label,
          blob_hash: n.blob_hash,
          created_at: n.created_at,
        }));

        dbRowsEl.textContent = JSON.stringify(rows, null, 2);
      } catch (err) {
        dbRowsEl.textContent = `DB read failed: ${String(err)}`;
      }
    }

    function floatTo16BitPCM(float32Array) {
      const output = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i += 1) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return output;
    }

    function writeString(view, offset, str) {
      for (let i = 0; i < str.length; i += 1) {
        view.setUint8(offset + i, str.charCodeAt(i));
      }
    }

    function encodeWav(samples, sampleRate) {
      const pcm = floatTo16BitPCM(samples);
      const bytesPerSample = 2;
      const blockAlign = bytesPerSample * 1;
      const buffer = new ArrayBuffer(44 + pcm.length * bytesPerSample);
      const view = new DataView(buffer);

      writeString(view, 0, "RIFF");
      view.setUint32(4, 36 + pcm.length * bytesPerSample, true);
      writeString(view, 8, "WAVE");
      writeString(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, "data");
      view.setUint32(40, pcm.length * bytesPerSample, true);

      let offset = 44;
      for (let i = 0; i < pcm.length; i += 1) {
        view.setInt16(offset, pcm[i], true);
        offset += 2;
      }
      return new Blob([view], { type: "audio/wav" });
    }

    function mergeChunks(floatChunks) {
      const totalLength = floatChunks.reduce((sum, c) => sum + c.length, 0);
      const output = new Float32Array(totalLength);
      let offset = 0;
      for (const chunk of floatChunks) {
        output.set(chunk, offset);
        offset += chunk.length;
      }
      return output;
    }

    async function startRecording() {
      try {
        chunks = [];
        wavBlob = null;
        setStatus("Requesting microphone permission...");

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            noiseSuppression: true,
            echoCancellation: true,
          },
        });

        audioContext = new AudioContext({ sampleRate: 22050 });
        sourceNode = audioContext.createMediaStreamSource(mediaStream);
        processorNode = audioContext.createScriptProcessor(4096, 1, 1);

        processorNode.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          chunks.push(new Float32Array(input));
        };

        sourceNode.connect(processorNode);
        processorNode.connect(audioContext.destination);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        uploadBtn.disabled = true;
        setStatus("Recording...");
      } catch (err) {
        setStatus("Failed to start recording");
        resultEl.textContent = String(err);
      }
    }

    async function stopRecording() {
      if (!audioContext) return;

      processorNode.disconnect();
      sourceNode.disconnect();
      mediaStream.getTracks().forEach((t) => t.stop());
      await audioContext.close();

      const allSamples = mergeChunks(chunks);
      wavBlob = encodeWav(allSamples, 22050);

      previewEl.src = URL.createObjectURL(wavBlob);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      uploadBtn.disabled = false;
      setStatus(`Recorded ${Math.round(wavBlob.size / 1024)} KB WAV`);
    }

    async function uploadWav() {
      if (!wavBlob) return;

      setStatus("Uploading WAV...");
      uploadBtn.disabled = true;

      const form = new FormData();
      form.append("file", wavBlob, `capture_${Date.now()}.wav`);

      try {
        const response = await fetch("/api/audio/upload", {
          method: "POST",
          body: form,
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Upload failed");
        }

        resultEl.textContent = JSON.stringify(payload, null, 2);
        setStatus("Uploaded and stored successfully");
        await loadRecentDbRows();
      } catch (err) {
        resultEl.textContent = String(err);
        setStatus("Upload failed");
      } finally {
        uploadBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);
    uploadBtn.addEventListener("click", uploadWav);
    loadRecentDbRows();
  </script>
</body>
</html>
